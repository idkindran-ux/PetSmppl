name: build
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: |
          rm -rf ZebraPets
          unzip -qo "$(ls -t *.zip | head -1)"
          cd ZebraPets && mvn -B -q package
          cp target/ZebraPets-*.jar ../ZebraPets.jar
      - run: |
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f ZebraPets.jar
          git commit -m "Build jar" || echo "no changes"
          git push
          
